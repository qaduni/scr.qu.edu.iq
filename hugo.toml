baseURL = 'https://scr.qu.edu.iq/'
locale = 'ar'
defaultContentLanguage = 'ar'
defaultContentLanguageInSubdir = true
title = "قسم البعثات والعلاقات الثقافية - جامعة القادسية"
buildFuture = true
theme = "qu.theme"

[module]
  [[module.mounts]]
    source = "assets"
    target = "assets"
  
  [[module.mounts]]
    source = "static/media"
    target = "assets/media"

[pagination]
  pagerSize = 10

[languages]
  [languages.ar]
    label = "العربية"
    weight = 1
    direction = "rtl"
    locale = "ar"

  [languages.en]
    label = "English"
    weight = 2
    direction = "ltr"
    locale = "en"

[server]
  [[server.redirects]]
    from = '/ar/**'
    to = '/ar/404.html'
    status = 404

  [[server.redirects]]
    from = '/en/**'
    to = '/en/404.html'
    status = 404

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      # Strapi authors are trusted, but keep this 'false' so a compromised CMS
      # account can't inject raw <script>/<iframe>/on-event handlers via
      # markdown bodies.
      unsafe = false


[sitemap]
  changefreq = "weekly"
  filename = "sitemap.xml"
  priority = 0.5
